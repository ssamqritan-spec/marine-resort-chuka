services:
  - type: web
    name: marine-resort-chuka
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: .
    headers:
      - {path: /*, name: X-Content-Type-Options, value: nosniff}
      - {path: /*, name: X-Frame-Options, value: DENY}
      - {path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin}
      - {path: /*, name: Content-Security-Policy, value: "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://muxqbopjdlxjapsopuxq.supabase.co; frame-ancestors 'none'"}
      - {path: /assets/*, name: Cache-Control, value: "public, max-age=31536000, immutable"}
      - {path: /index.html, name: Cache-Control, value: no-cache}
      - {path: /sw.js, name: Cache-Control, value: no-cache}
